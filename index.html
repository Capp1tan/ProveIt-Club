    <script>
      (() => {
        let pending = 0;
        const signal = () => window.dispatchEvent(new Event('proveit:boot-network-change'));
        if (typeof window.fetch === 'function') {
          const originalFetch = window.fetch.bind(window);
          window.fetch = (...args) => {
            pending += 1; signal();
            let request;
            try { request = originalFetch(...args); }
            catch (error) { pending = Math.max(0, pending - 1); signal(); throw error; }
            return Promise.resolve(request).finally(() => { pending = Math.max(0, pending - 1); signal(); });
          };
        }
        window.__proveitBootNetwork = {
          get pending() { return pending; },
          waitForIdle(quietMs = 900, maxWaitMs = 18000) {
            return new Promise((resolve) => {
              let quietTimer, deadlineTimer, finished = false;
              const finish = (timedOut) => {
                if (finished) return;
                finished = true;
                clearTimeout(quietTimer); clearTimeout(deadlineTimer);
                window.removeEventListener('proveit:boot-network-change', check);
                resolve({ idle: !timedOut, pending });
              };
              const check = () => {
                clearTimeout(quietTimer);
                if (pending === 0) quietTimer = window.setTimeout(() => pending === 0 ? finish(false) : check(), quietMs);
              };
              window.addEventListener('proveit:boot-network-change', check);
              deadlineTimer = window.setTimeout(() => finish(true), maxWaitMs);
              check();
            });
          },
        };
        window.__proveitFinishBoot = () => {
          if (!document.documentElement.hasAttribute('data-app-loading')) return;
          clearTimeout(window.__proveitBootFallback);
          document.getElementById('root')?.removeAttribute('aria-hidden');
          document.documentElement.removeAttribute('data-app-loading');
          const screen = document.getElementById('proveit-boot');
          screen?.classList.add('is-hidden');
          window.setTimeout(() => screen?.remove(), 380);
        };
        // Safety net for stalled connections; normal startup reveals much sooner.
        window.__proveitBootFallback = window.setTimeout(() => window.__proveitFinishBoot(), 45000);
      })();
    </script>
