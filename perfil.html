<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101310">
  <title>Mi perfil — Prove.it Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Las fuentes no bloquean el primer dibujo; el texto aparece con la fuente de respaldo. -->
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="profile.css">
</head>
<body class="profile-page">
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="Prove.it Club, inicio"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>prove<span class="brand-dot">.</span>it<span class="brand-club">CLUB</span></span></a>
    <nav class="top-actions"><a class="back-link" href="index.html">← Volver al inicio</a><a class="profile-avatar-link" data-profile-link href="/perfil.html" aria-label="Ir a mi perfil" title="Mi perfil" hidden></a><button class="login-button" id="signOutButton" type="button">Cerrar sesión</button></nav>
  </header>
  <main class="profile-main">
    <section class="profile-heading"><p class="eyebrow"><span class="live-dot"></span> TU IDENTIDAD EN EL CLUB</p><h1>Tu perfil.</h1><p>Elegí cómo querés aparecer cuando compitas.</p></section>
    <form class="profile-card" id="profileForm">
      <div class="avatar-editor">
        <div class="avatar-preview" id="avatarPreview" aria-label="Vista previa de la foto">?</div>
        <div><label class="file-button" for="avatarInput">Elegir foto</label><input id="avatarInput" name="avatar" type="file" accept="image/jpeg,image/png,image/webp" hidden><p class="field-help">JPG, PNG o WebP · máximo 2 MB</p></div>
      </div>
      <label class="profile-field">Nick <span>obligatorio</span><input name="nickname" required minlength="3" maxlength="24" autocomplete="nickname" placeholder="Tu nombre en la competencia"><small>Entre 3 y 24 caracteres.</small></label>
      <label class="profile-field">Biografía <span>opcional</span><textarea name="bio" maxlength="200" rows="3" placeholder="Una línea sobre vos, tus juegos o tu estilo."></textarea><small><span id="bioCount">0</span>/200</small></label>
      <p class="profile-notice" id="profileNotice" role="status" aria-live="polite"></p>
      <button class="primary-button profile-save" type="submit">Guardar perfil <span aria-hidden="true">↗</span></button>
    </form>
  </main>
  <footer class="site-footer"><a class="footer-brand" href="index.html">prove.it <span>CLUB</span></a><span>COMPETÍ · DISFRUTÁ · VOLVÉ A INTENTARLO</span><span>© 2026 PROVE.IT CLUB</span></footer>
  <script type="module" src="/src/profile-ui.js"></script>
  <script type="module" src="/src/auth-ui.js"></script>
</body>
</html>
